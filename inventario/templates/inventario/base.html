{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestión de inventario{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'inventario/css/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container py-3"><a class="brand" href="{% url 'inventario:producto_lista' %}"><span class="brand-mark" aria-hidden="true">GI</span> Gestión de inventario</a></div>
  </header>
  <main class="container py-4 py-lg-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
